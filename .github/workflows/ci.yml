name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q --junitxml=test-results.xml
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
      - name: Installed wheel smoke test
        run: uv run --python "${{ matrix.python }}" python scripts/smoke_wheel.py

  release-pairs:
    name: Pinned vulnerable and fixed releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Check vulnerable detection and clean fixes
        env:
          MCPIRANHA_QUALITY_REGISTRIES: "1"
        run: uv run pytest -q tests/test_detection_quality_registry.py --junitxml=release-pairs.xml
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-release-pairs
          path: release-pairs.xml

  docker-sandbox:
    name: Real Docker sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Sandboxed scan of a real server
        env:
          MCPIRANHA_DOCKER_TESTS: "1"
        run: >-
          uv run pytest -q tests/test_sandbox.py tests/test_dynamic.py tests/test_dynamic_reliability.py
          -k "real_docker or real_dynamic or real_adversarial"
      - name: Zoo supply-chain samples against local registries
        env:
          MCPIRANHA_ZOO_REGISTRIES: "1"
        run: |
          uv run python zoo/registries/registries.py up
          uv run pytest -q tests/test_bench.py -k registries
