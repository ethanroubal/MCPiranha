name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q --junitxml=test-results.xml
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
      - name: Installed wheel smoke test
        if: runner.os == 'Windows'
        run: |
          uv build
          uv run python scripts/smoke_wheel.py

  docker-sandbox:
    name: Real Docker sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Sandboxed scan of a real server
        env:
          MCPIRANHA_DOCKER_TESTS: "1"
        run: >-
          uv run pytest -q tests/test_sandbox.py tests/test_dynamic.py tests/test_dynamic_reliability.py
          -k "real_docker or real_dynamic or real_adversarial"
      - name: Zoo supply-chain samples against local registries
        env:
          MCPIRANHA_ZOO_REGISTRIES: "1"
        run: |
          uv run python zoo/registries/registries.py up
          uv run pytest -q tests/test_bench.py -k registries
