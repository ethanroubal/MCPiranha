[project]
name = "MCPiranha"
version = "0.4.0"
description = "Security scanner for Model Context Protocol (MCP) servers"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "anyio>=4.6",
    "jsonschema>=4.23",
    "mcp>=2.3,<3",
    "packaging>=24",
    "pydantic>=2.9",
    "pyyaml>=6",
    "referencing>=0.35",
    "rich>=13.7",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/ethanroubal/MCPiranha"
Repository = "https://github.com/ethanroubal/MCPiranha"
Issues = "https://github.com/ethanroubal/MCPiranha/issues"
Documentation = "https://github.com/ethanroubal/MCPiranha/tree/main/docs"

[project.scripts]
mcpiranha = "mcpiranha.cli:app"

[project.optional-dependencies]
ml = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
]

# Third-party rule packs register here, e.g.
# [project.entry-points."mcpiranha.rules"]
# my_rules = "my_package.rules"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpiranha"]

# The package and its docs only: the zoo (deliberately malicious samples), fixtures, tests and
# calibration stay in the repository, where security tools expect them.
[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
