- id: tool-output-poisoning
  title: Injection in what a tool returns, only visible when it's called
  surface: runtime
  status: detected
  rules: [MCP-TP-003, MCP-TP-004, MCP-TP-005]
  tests: [zoo:poisoned-tool-output, test:tests/test_dynamic.py::test_tool_output_is_only_read_with_explicit_invocation]

- id: description-behavior-mismatch
  title: A tool that does something other than its description says, with nothing hidden
  surface: source
  status: partial
  rules: [MCP-SRC-001, MCP-SRC-002, MCP-SRC-003]
  tests: [zoo:postmark-bcc, zoo:startup-env-harvest, zoo:credential-stealer]
  gap: >-
    Specific hidden behaviors are detected in source; a general "weather tool that reads $HOME"
    comparison needs the LLM tier or dynamic tracing (Phases 2 and 4).

