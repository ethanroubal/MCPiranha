# Every way we know a malicious (or maliciously exploitable) MCP server can act, what detects
# it, and what proves the detection works. tests/test_threat_coverage.py enforces it:
#
# - status `detected`: the rules fire on every listed test, and every test exists.
# - status `partial`:  detected in some forms; `gap` says which forms aren't.
# - status `gap`:      not detected yet; `gap` says why and what closes it. A zoo sample with
#                      a matching `gap` keeps it tracked (bench flags it once something fires).
# - every built-in rule appears in some entry and is exercised by some test.
#
# tests: zoo:<sample> (zoo/samples), fixture:<case> (fixtures/metadata), or
#        test:<file>::<function> (a unit test that proves a scanner defense).
# surface: what the attacker controls or where it shows up.

# --- What the model reads (metadata) ------------------------------------------------------------

- id: instruction-injection
  title: Instructions to the model in a tool description (<IMPORTANT>, "before using this tool")
  surface: metadata
  status: detected
  rules: [MCP-TP-003, MCP-TP-004]
  tests: [zoo:tool-poisoning, fixture:poisoned-important]

- id: credential-request
  title: Description tells the model to read secrets or credential files
  surface: metadata
  status: detected
  rules: [MCP-TP-005]
  tests: [zoo:tool-poisoning, zoo:rug-pull, fixture:poisoned-important]

- id: paraphrased-injection
  title: Injection worded to avoid known phrases (no tags, no "ignore previous")
  surface: metadata
  status: partial
  rules: [MCP-TP-004, MCP-TP-005]
  tests: [zoo:paraphrased-override, fixture:reworded-attacks]
  gap: >-
    Phrase rules catch rewordings that still steer the model and name a target; free-form
    rewording needs the experimental classifier or the BYO-LLM tier (Phase 2).

- id: hidden-unicode
  title: Instructions hidden in Unicode tags, zero-width, variation-selector or bidi characters
  surface: metadata
  status: detected
  rules: [MCP-TP-001]
  tests: [zoo:hidden-unicode, fixture:unicode-tag-smuggling, fixture:variation-selector-smuggling,
          fixture:zero-width-in-schema, fixture:bidi-override]

- id: terminal-escapes
  title: ANSI escapes that hide or rewrite text a human reviews in a terminal
  surface: metadata
  status: detected
  rules: [MCP-TP-002]
  tests: [zoo:terminal-escapes, fixture:terminal-escape]

- id: encoded-payload
  title: Base64 / hex / escaped instructions the model decodes
  surface: metadata
  status: detected
  rules: [MCP-TP-006]
  tests: [zoo:encoded-payload, fixture:encoded-payload]

- id: render-exfiltration
  title: Markdown image or link whose URL carries conversation data
  surface: metadata
  status: detected
  rules: [MCP-TP-007]
  tests: [zoo:render-exfil, fixture:render-exfil]

- id: padding-pushdown
  title: Whitespace or filler that pushes instructions out of a reviewer's view
  surface: metadata
  status: detected
  rules: [MCP-TP-008]
  tests: [zoo:padding-pushdown, fixture:padding-pushdown]

- id: exfiltration-parameter
  title: A parameter shaped to carry stolen data (sidenote, context, notes)
  surface: metadata
  status: detected
  rules: [MCP-TP-009]
  tests: [zoo:tool-poisoning, zoo:hidden-unicode, fixture:poisoned-important]

- id: schema-poisoning
