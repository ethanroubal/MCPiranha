- id: handler-injection
  title: Tool arguments reach a shell, file path, URL or SQL query unchecked (exploitable server)
  surface: source
  status: partial
  rules: [MCP-SRC-101, MCP-SRC-102, MCP-SRC-103, MCP-SRC-104, MCP-DY-006]
  tests: [zoo:vulnerable-tools-py, zoo:vulnerable-tools-js, zoo:safe-tools, test:tests/test_dynamic_reliability.py::test_nested_fuzz_and_correlated_canaries, test:tests/test_quality_improvements.py::test_varied_objects_aliases_assignments_and_return_summaries, test:tests/test_deep_helpers.py::test_deep_sink_calls_and_safe_twins, test:tests/test_deep_helpers.py::test_return_depth_exhaustion_is_visible]
  gap: >-
    Taint is followed across the package's files through a cached, context-sensitive work queue
    for handlers registered the MCP SDKs' ways. Exhausted helper, return-summary, node,
    propagation, guard and finding limits mark source coverage partial. Simple object/dictionary fields and aliases, common array/iterable callbacks
    and helper returns are followed. Arbitrary heap objects, dynamic dispatch, chains beyond the analysis budgets
    and instances other than self/this remain unsupported. Path guard recognition is value-specific and ordered, with conservative support
    for known containment predicates and separator rejection, not arbitrary custom validators.
    Guard inference stops at 2,000 syntax nodes per function; unsupported patterns remain
    candidates for review. Filesystem races, custom types and arbitrary side effects are not proven safe.

# --- Runtime behavior ------------------------------------------------------------------------------

- id: runtime-egress
  title: Server phones home or exfiltrates over the network at startup or when called
  surface: runtime
  status: partial
  rules: [MCP-DY-004]
  tests: [test:tests/test_dynamic.py::test_trace_rules_and_phases, test:tests/test_dynamic.py::test_real_dynamic_docker]
  gap: Opt-in syscall tracing and proxy logs capture attempts and queried DNS names, not all exfiltration channels; requires a compatible Docker tracing runtime.

- id: runtime-file-access
  title: Server reads files it has no reason to, at startup or when called
  surface: runtime
  status: partial
  rules: [MCP-DY-003, MCP-DY-005, MCP-DY-007]
  tests: [test:tests/test_dynamic.py::test_trace_rules_and_phases, test:tests/test_dynamic.py::test_real_dynamic_docker, test:tests/test_dynamic_reliability.py::test_trace_paths_split_records_and_interference, test:tests/test_dynamic_files.py::test_hardlink_and_rename_aliases_retain_identity_but_replacement_does_not]
  gap: External tracing follows observed aliases/descriptors and readable mappings; unseen descriptor transfers, io_uring, mapping permission changes, namespace races and kernel-level evasion remain gaps.

- id: conditional-trigger
  title: Malice that waits for a date, a host, a user or a number of calls
  surface: runtime
  status: gap
  gap: Bounded invocation and tracing cannot guarantee activation of arbitrary time, host or identity triggers; source rules may still see the payload.

