  rules: [MCP-SRC-002, MCP-SRC-004, MCP-SRC-005]
  tests: [zoo:dep-hijacked-npm, zoo:dep-hidden-payload-pypi]
  gap: >-
    The tree is resolved from registry metadata the way npx/uvx would, not installed: npm
    lockfiles shipped in a package and hoisting differences aren't modeled, PyPI markers are
    evaluated for the sandbox's CPython 3.12 on Linux, and resolution stops at 400 packages and
    300 MB of archives per server. Docker images' contents aren't analyzed.

